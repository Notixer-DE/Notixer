[package]
name = "noter-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
loco-rs = { version = "=1.3.1", default-features = false, features = ["cli", "with-db", "db-postgres"] }
axum = "0.8"
async-trait = "0.1"
argon2 = "0.5"
sea-orm = { version = "=2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "=2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
